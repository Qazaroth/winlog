[package]
name = "winlog"
version = "0.7.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
roxmltree = "0.20"
anyhow = "1.0.104"
clap = {version = "4.6.6", features = ["derive"]}
windows = {version = "0.62.2", features = ["Win32_Foundation", "Win32_System_EventLog"] }
colored = "3.1.1"
crossbeam-channel = "0.5.16"
ctrlc = "3.5.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
csv = "1.4.0"
ratatui = "0.30.2"
crossterm = "0.29.0"
sysinfo = "0.38.4"
arboard = "3.6.1"
nucleo-matcher = "0.3.1"
regex = "1.13.1"
webbrowser = "1.2.4"
serde_yaml = "0.9.34"
