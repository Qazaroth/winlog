name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Create release zip archive
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path "target\release\winlog.exe" -DestinationPath "winlog-$version-x86_64-pc-windows-msvc.zip"

      - name: Install git-cliff
        run: cargo install git-cliff

      - name: Generate release notes
        shell: bash
        run: |
          git-cliff -c cliff.toml --latest > RELEASE_NOTES.md

      - name: Show generated release notes
        shell: bash
        run: |
          echo "===== RELEASE_NOTES.md ====="
          cat RELEASE_NOTES.md
          echo "============================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          overwrite: true
          files: |
            winlog-*.zip
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up
        if: always()
        shell: bash
        run: rm -f RELEASE_NOTES.md
